server:
  port: ${SERVER_PORT}

spring:
  datasource:
    url: jdbc:${MYSQL_URL}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
    username: ${MYSQL_USER}
    password: ${MYSQL_ROOT_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  profiles:
    active: dev
  sql:
    init:
      continue-on-error: true
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: 0
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: -1ms


management:
  endpoints:
    web:
      exposure:
        include: health
sky:
  jwt:
    # 安全要求：JWT 密钥必须通过环境变量注入，禁止硬编码
    secret-key: ${JWT_SECRET_KEY}
    ttl: 86400000
    token-name: token

# Resume缓存配置
resume:
  cache:
    # 是否启用Redis缓存(本地没有Redis时设为false)
    enabled: ${RESUME_CACHE_ENABLED:true}
    # 列表缓存过期时间(秒)
    list-ttl: 60
    # 详情缓存过期时间(秒)
    detail-ttl: 300


mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.demo.un
  configuration:
    map-underscore-to-camel-case: true
